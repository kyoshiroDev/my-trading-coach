<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MyTradingCoach · Journal de Trading Intelligent avec Coach IA</title>
    <meta
      name="description"
      content="Journal de trading intelligent avec analyse IA de tes émotions et performances. Suivi des trades, analytics avancés, Weekly Debrief automatique."
    />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />
    <!-- Écran de chargement : visible dès le HTML, avant le JS. Retiré par `App` après le
         rendu de la première page (removeBootScreen). Valeurs de theme.css en repli : la
         feuille de style n'est peut-être pas encore là. Police monospace SYSTÈME : JetBrains Mono
         ferait télécharger une police en concurrence avec le JS (≈ 0,2 s de plus en 4G lente). -->
    <style>
      #mtc-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--bg, #080c14);
        color: var(--text-3, #8398b5);
        font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
      }
      #mtc-boot svg {
        width: 48px;
        height: 48px;
        animation: mtc-boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes mtc-boot-pulse {
        50% {
          opacity: 0.45;
          transform: scale(0.92);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #mtc-boot svg {
          animation: none;
        }
      }
    </style>
    <!-- Parcours d'inscription : `register_view` envoyé DÈS l'arrivée sur /register, avant le
         téléchargement de l'app (un visiteur qui part pendant le chargement est compté). Même
         logique que le script de la landing : sendBeacon en text/plain (pas de requête préalable
         CORS, part même si la page change). `window.mtcRegisterView` dit à SignupFunnelService
         que ce chargement est traité (envoyé, ou volontairement pas : connecté, mode interne) ;
         sans lui (hôte local, navigation interne), c'est l'app qui envoie.
         Motif IN_APP = IN_APP_UA_PATTERN de @mtc/shared (vérifié par index-register-view.spec.ts). -->
    <script id="mtc-register-view">
      (function () {
        try {
          if (!/^\/register\/?$/.test(location.pathname)) return;
          var host = location.hostname.match(/^((?:dev|beta)\.)?app\.mytradingcoach\.app$/);
          if (!host) return;
          var api = 'https://' + (host[1] || '') + 'api.mytradingcoach.app/api/public/funnel';
          var IN_APP = 'Instagram|FBAN|FBAV|FB_IAB|FBIOS|TikTok|musical_ly|Line/';
          window.mtcRegisterView = true;
          var params = new URLSearchParams(location.search);
          var flag = params.get('internal');
          var internal = flag === '1';
          try {
            if (flag !== '0' && flag !== '1') internal = localStorage.getItem('mtc_internal') === '1';
            // Déjà connecté : pas une arrivée sur l'inscription.
            if (localStorage.getItem('access_token') && localStorage.getItem('user')) return;
          } catch (e) {}
          if (internal) return;
          // Origine : UTM du lien, sinon celle gardée pour l'onglet (mtc_utm, écrite par
          // RegisterComponent), sinon le site d'origine (referrerHost).
          var pick = function (k) { return (params.get(k) || '').trim().slice(0, 100) || undefined; };
          var o = { source: pick('utm_source'), medium: pick('utm_medium'), campaign: pick('utm_campaign') };
          if (!o.source && !o.medium && !o.campaign) {
            try {
              var s = JSON.parse(sessionStorage.getItem('mtc_utm') || '{}') || {};
              o = { source: s.acquisitionSource, medium: s.acquisitionMedium, campaign: s.acquisitionCampaign };
            } catch (e) {}
          }
          if (!o.source && !o.medium && !o.campaign) {
            try {
              var ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : '';
              if (ref && !/(^|\.)mytradingcoach\.app$/.test(ref) && ref !== 'localhost') o = { source: ref.slice(0, 100), medium: 'referral' };
            } catch (e) {}
          }
          var body = JSON.stringify({
            step: 'register_view',
            source: o.source,
            medium: o.medium,
            campaign: o.campaign,
            inApp: new RegExp(IN_APP, 'i').test(navigator.userAgent || ''),
          });
          var sent = false;
          try { sent = !!(navigator.sendBeacon && navigator.sendBeacon(api, new Blob([body], { type: 'text/plain' }))); } catch (e) {}
          if (!sent) fetch(api, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: body }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="mtc-boot" role="status">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="mtc-boot-g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="15" fill="url(#mtc-boot-g)" />
        <polyline
          points="3,16 6,16 8,10 10,22 12,6 14,20 16,12 18,16 29,16"
          fill="none"
          stroke="#e2eaf5"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Chargement…</span>
    </div>
    <mtc-root></mtc-root>
  </body>
</html>
