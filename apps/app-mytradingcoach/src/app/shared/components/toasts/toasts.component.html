<div class="toasts" data-testid="toasts">
  @for (t of toasts.visible(); track t.id) {
    <!-- Case repliable : sa hauteur s'ouvre à l'entrée et se replie à la sortie, pour que la
         pile se décale en douceur. animate.leave (API native Angular ≥ 20.2) garde la case le
         temps de l'animation de sortie, puis la retire. -->
    <div class="toast-slot" [animate.leave]="leaveClass(t.id)">
      <div class="toast-clip">
        <div class="toast {{ t.type }}"
             [class.dragging]="drag()?.id === t.id"
             [style.transform]="dragTransform(t.id)"
             [style.opacity]="dragOpacity(t.id)"
             [attr.role]="t.type === 'error' ? 'alert' : 'status'"
             [attr.aria-live]="live(t.type)"
             aria-atomic="true"
             [attr.data-testid]="'toast-' + t.type"
             (mouseenter)="toasts.pause(t.id)" (mouseleave)="toasts.resume(t.id)"
             (focusin)="toasts.pause(t.id)" (focusout)="toasts.resume(t.id)"
             (pointerdown)="onPointerDown($event, t.id)"
             (pointermove)="onPointerMove($event, t.id)"
             (pointerup)="onPointerUp($event, t.id)"
             (pointercancel)="onPointerCancel(t.id)">
          <!-- Compte à rebours EN HAUT : se vide sur la durée du toast, figé pendant la pause.
               Recréé (@for sur la version) quand le même message est relancé. -->
          @if (t.duration !== null) {
            @for (v of [t.version]; track v) {
              <div class="toast-bar" aria-hidden="true" data-testid="toast-bar"
                   [style.animation-duration.ms]="t.duration"
                   [class.paused]="toasts.isPaused(t.id)"></div>
            }
          }
          <!-- SVG en ligne (tracés Lucide) : ce composant est chargé au démarrage, importer
               @lucide/angular ici mettrait toutes les icônes de l'app dans le bundle initial. -->
          <svg class="toast-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @switch (t.type) {
              @case ('success') { <circle cx="12" cy="12" r="10" /><path d="m16 9-5.5 5.5L8 12" /> }
              @case ('error') { <circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /> }
              @case ('warning') { <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /> }
              @default { <circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /> }
            }
          </svg>
          <p class="toast-msg">{{ t.message }}</p>
          <button class="toast-x" type="button" aria-label="Fermer la notification"
                  data-testid="toast-close" (click)="toasts.dismiss(t.id)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
      </div>
    </div>
  }
  @if (toasts.queued() > 0) {
    <div class="toast-queue" aria-hidden="true">+{{ toasts.queued() }}</div>
  }
</div>
