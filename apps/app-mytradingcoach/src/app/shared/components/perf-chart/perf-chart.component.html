<div class="pc-head" [class.narrow]="narrow()">
  <div class="pc-title">
    <svg [lucideIcon]="icon()" [size]="14" class="pc-icon" aria-hidden="true"></svg>
    <span>{{ title() }}</span>
    <ng-content select="[chartInfo]" />
  </div>
  @if (floorHead(); as fh) {
    <span class="pc-value pc-floor" [class.wide]="narrow()" [class.warn]="fh.tone === 'yellow'" [class.neg]="fh.tone === 'red'" data-testid="perf-chart-value">
      <span class="pc-floor-main"><span class="pc-vlab">Marge avant la limite</span> {{ fh.margin }}</span>
      <span class="pc-floor-sub" data-testid="perf-chart-floor">Solde {{ fh.balance }} · plancher actuel {{ fh.floor }}</span>
    </span>
  } @else if (keyValue(); as kv) {
    <span class="pc-value" [class.pos]="kv.tone === 'pos'" [class.neg]="kv.tone === 'neg'" data-testid="perf-chart-value">
      {{ kv.text }}
      @if (kv.max && !narrow()) {
        <span class="pc-max">(max {{ kv.max }})</span>
      }
    </span>
  }
  <div class="pc-controls"><ng-content select="[chartControls]" /></div>
</div>
<div class="pc-body">
  <canvas
    #canvas
    class="pc-canvas"
    role="img"
    [attr.aria-label]="ariaLabel()"
    [attr.data-testid]="kind() === 'equity' ? 'equity-curve' : 'drawdown-curve'"
  ></canvas>
  @if (!points().length && !loading()) {
    <div class="pc-empty">{{ emptyMessage() }}</div>
  }
</div>
