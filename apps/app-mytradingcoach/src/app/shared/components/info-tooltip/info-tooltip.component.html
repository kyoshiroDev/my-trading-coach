<span class="it-wrap">
  <button
    type="button"
    class="it-btn"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    aria-describedby="it-content"
    (click)="toggle(); $event.stopPropagation()"
    (mouseenter)="show()"
    (mouseleave)="hide()"
    (focus)="show()"
    (blur)="hide()"
  >?</button>

  @if (open()) {
    <span id="it-content" class="it-content" role="tooltip"
      [style.top.px]="anchor().top" [style.left.px]="anchor().left">{{ text() }}</span>
  }
</span>
