<div class="auth-page">
  <div class="bg-glow"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="icon/logo-navbar.svg" alt="MyTradingCoach" />
    </div>

    <h1 class="auth-title">Bon retour 👋</h1>
    <p class="auth-subtitle">
      Connecte-toi pour accéder à ton journal de trading
    </p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group" [class.input-error]="emailError()">
        <label for="email">Email</label>
        <input
          id="email"
          [attr.aria-invalid]="!!emailError()"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
          type="email"
          data-testid="login-email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          placeholder="trader@email.com"
          autocomplete="email"
          (blur)="emailTouched.set(true)"
        />
        @if (emailError()) {
          <span class="field-error" id="email-error">{{ emailError() }}</span>
        }
      </div>

      <div class="form-group" [class.input-error]="passwordError()">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input
            id="password"
            [attr.aria-invalid]="!!passwordError()"
            [attr.aria-describedby]="passwordError() ? 'password-error' : null"
            data-testid="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            (blur)="passwordTouched.set(true)"
          />
          <button
            type="button"
            class="eye-btn"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >
            <svg
              [lucideIcon]="showPassword() ? EyeOffIcon : EyeIcon"
              [size]="15"
              color="var(--text-2)"></svg>
          </button>
        </div>
        @if (passwordError()) {
          <span class="field-error" id="password-error">{{ passwordError() }}</span>
        }
      </div>

      <div class="forgot-link-row">
        <a routerLink="/forgot-password" class="forgot-link"
          >Mot de passe oublié ?</a
        >
      </div>

      <button
        type="submit"
        data-testid="login-submit"
        [disabled]="isLoading()"
        class="btn-submit"
      >
        @if (isLoading()) {
          <span class="spinner"></span> Connexion...
        } @else {
          Se connecter
        }
      </button>

      @if (apiError()) {
        <div class="error-msg" role="alert" data-testid="error-message">
          {{ apiError() }}
        </div>
      }
    </form>

    <p class="auth-link">
      Pas encore de compte ?
      <a routerLink="/register">S'inscrire gratuitement</a>
    </p>
  </div>
</div>
