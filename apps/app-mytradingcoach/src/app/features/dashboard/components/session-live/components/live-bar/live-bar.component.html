<header class="lb-bar" data-testid="live-bar-header">
  @if (clock(); as c) {
    @if (c.kind === 'stale') {
      <div class="lb-stale" data-testid="live-bar-stale">
        <span>Session ouverte depuis le {{ c.since }}, clôture-la</span>
        <button type="button" class="lb-stale-close" (click)="closeSession.emit()">Clôturer</button>
      </div>
    } @else {
      <div class="lb-clock" data-testid="live-bar-clock"><span class="lb-dot" aria-hidden="true"></span>{{ c.label }}</div>
    }
  }
  <span class="lb-trades" data-testid="live-bar-trades">
    Trades {{ tradesCount() }}@if (tradesMax() !== null) { / {{ tradesMax() }} }
  </span>
  @let total = totalPnl();
  @let shown = total ?? realizedPnl();
  <span class="lb-pnl" data-testid="live-bar-pnl" [class.green]="shown > 0" [class.red]="shown < 0"
        [attr.title]="total === null ? 'Réalisé seul : latent de la position ouverte inconnu' : 'Réalisé + latent du jour'">
    {{ fmt(shown) }}
  </span>
</header>
