# API dev — déploiement blue/green (SCA-B8-03). Ne pas lancer `up` à la main sur tout le fichier :
# passer par `infra/deploy-api.sh dev`, qui construit l'image, migre, démarre la couleur inactive,
# vérifie qu'elle reçoit du trafic, puis draine l'ancienne (voir .claude/agents/deploy.md).
#
# - api_blue / api_green : web (APP_ROLE=web), derrière le même service Traefik `api-dev`. Une seule
#   couleur tourne hors déploiement ; les deux ~1 min pendant la bascule.
# - worker : crons + files BullMQ (APP_ROLE=worker), sans route Traefik, redémarré simplement.
# Les images sont taguées par SHA (`mtc_api_dev:<sha>`) ; `:blue`, `:green`, `:worker` et `:latest`
# pointent sur la version que porte chaque conteneur.

x-api: &api
  restart: unless-stopped
  env_file: .env.dev
  networks:
    - mtc_network
  # Laisse aux workers le temps de finir leurs requêtes et de fermer Redis/Prisma/BullMQ.
  stop_grace_period: 30s
  # Drain (deploy-api.sh) : /tmp/drain rend le conteneur « unhealthy » → Traefik ne lui envoie plus
  # rien, puis il est arrêté. start_interval : sain en quelques secondes au démarrage.
  healthcheck:
    test: ["CMD-SHELL", "[ ! -f /tmp/drain ] && wget -qO- http://localhost:3000/api/health >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 90s
    start_interval: 2s

x-api-env: &api-env
  TZ: Europe/Paris
  # Plafond de tas V8 par process : un worker qui dérape meurt seul (relancé par le primaire)
  # au lieu de pousser tout le conteneur à l'OOM (audit scalabilité C1).
  NODE_OPTIONS: --max-old-space-size=384
  # Migrations lancées une fois par deploy-api.sh avant la bascule (SCA-B8-02).
  RUN_MIGRATIONS: "false"

x-web-labels: &web-labels
  - "traefik.enable=true"
  - "traefik.http.routers.api-dev.rule=Host(`dev.api.mytradingcoach.app`)"
  - "traefik.http.routers.api-dev.entrypoints=websecure"
  - "traefik.http.routers.api-dev.tls.certresolver=letsencrypt"
  # Labels identiques sur les deux couleurs (et au conteneur unique d'avant B8) : Traefik fusionne
  # les conteneurs d'un même service. Un routeur défini différemment par deux conteneurs serait
  # rejeté par Traefik → coupure. Ne jamais faire diverger ces labels entre couleurs.
  - "traefik.http.services.api-dev.loadbalancer.server.port=3000"

services:
  api_blue:
    <<: *api
    image: mtc_api_dev:blue
    container_name: mtc_api_dev_blue
    environment:
      <<: *api-env
      APP_ROLE: web
    # 3 workers × 384 Mo de tas + primaire + mémoire native (argon2, Chromium) : 2 Gio.
    mem_limit: 2g
    memswap_limit: 2g
    labels: *web-labels

  api_green:
    <<: *api
    image: mtc_api_dev:green
    container_name: mtc_api_dev_green
    environment:
      <<: *api-env
      APP_ROLE: web
    mem_limit: 2g
    memswap_limit: 2g
    labels: *web-labels

  worker:
    <<: *api
    image: mtc_api_dev:worker
    container_name: mtc_api_dev_worker
    environment:
      <<: *api-env
      APP_ROLE: worker
      # Un seul process : il porte les crons (worker cron du cluster) et les files.
      WEB_CONCURRENCY: "1"
    mem_limit: 1g
    memswap_limit: 1g
    labels:
      - "traefik.enable=false"

networks:
  mtc_network:
    external: true
