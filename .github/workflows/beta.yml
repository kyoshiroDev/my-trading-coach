name: Beta — CI/CD

# Pipeline dédié à la branche beta uniquement (env de pré-prod sur le VPS).
on:
  push:
    branches: [beta]

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, typecheck, build, tests, smoke E2E (définition commune : checks.yml) ─
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      affected: false

  # ── Deploy API beta → VPS (beta.api.mytradingcoach.app) ────────────────────
  deploy-api-beta:
    name: Deploy API beta to VPS
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - name: Deploy via SSH (beta)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/mytradingcoach/beta
            git fetch origin
            git reset --hard origin/beta
            docker compose -f docker-compose.beta.yml --env-file .env.beta build api
            docker compose -f docker-compose.beta.yml --env-file .env.beta up -d --force-recreate api
            docker buildx prune --keep-storage=8GB -f
            echo "Beta API deployment complete at $(date)"

  # ── Deploy Angular app beta → VPS static (beta.app.mytradingcoach.app) ──────
  deploy-app-beta:
    name: Deploy Angular beta to VPS
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build Angular (beta)
        run: pnpm nx build app-mytradingcoach --configuration=beta --skip-nx-cache
      - name: Verify build output
        run: |
          if [ ! -f "dist/apps/app-mytradingcoach/browser/index.html" ]; then
            echo "❌ build failed — index.html not found"
            exit 1
          fi
          echo "✅ build ok — $(du -sh dist/apps/app-mytradingcoach/browser/)"
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: rsync Angular beta → VPS
        run: |
          rsync -az --delete dist/apps/app-mytradingcoach/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/app-beta/
