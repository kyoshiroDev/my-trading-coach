name: Build mémoire

# Mesure le pic mémoire du build des images API et bot dans le builder plafonné de MTC (#1286),
# exactement comme sur le VPS prod (infra/build-image.sh : 1536 Mio, un pas à la fois), à froid
# (--no-cache). Un build qui grossit au point de dépasser le plafond casse ici, pas au CD de prod.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/api-mytradingcoach/**'
      - 'prisma/**'
      - 'libs/shared/**'
      - 'scripts/discord-bot/**'
      - 'vendor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infra/build-image.sh'
      - 'infra/buildkitd.toml'
      - '.github/workflows/build-memory.yml'

concurrency:
  group: build-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-memory:
    name: Build API et bot sous plafond mémoire
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Alerte sous la marge voulue : 1,3 Gio sur un plafond de 1,5 Gio.
      WARN_MIB: 1331
    steps:
      - uses: actions/checkout@v4

      - name: Build API (à froid)
        env:
          BUILD_EXTRA_ARGS: --no-cache
          BUILD_KEEP_RUNNING: '1'
        run: bash infra/build-image.sh apps/api-mytradingcoach/Dockerfile . mtc_api_mesure:ci

      - name: Pic mémoire du build API
        run: |
          peak=$(docker exec buildx_buildkit_mtc-build0 cat /sys/fs/cgroup/memory.peak)
          mib=$((peak / 1048576))
          echo "Pic mémoire du builder (API) : ${mib} Mio" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$mib" -le "$WARN_MIB" ] || echo "::warning::Build API à ${mib} Mio, au-dessus de ${WARN_MIB} Mio (plafond 1536)"

      # Builder recréé : memory.peak repart de zéro pour mesurer le bot seul.
      - name: Build bot Discord (à froid)
        env:
          BUILD_EXTRA_ARGS: --no-cache
          BUILD_KEEP_RUNNING: '1'
        run: |
          docker buildx rm mtc-build
          bash infra/build-image.sh scripts/discord-bot/Dockerfile scripts/discord-bot mtc_discord_bot:ci
          peak=$(docker exec buildx_buildkit_mtc-build0 cat /sys/fs/cgroup/memory.peak)
          echo "Pic mémoire du builder (bot) : $((peak / 1048576)) Mio" | tee -a "$GITHUB_STEP_SUMMARY"
