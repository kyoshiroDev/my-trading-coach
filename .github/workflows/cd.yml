name: CD — Deploy to Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ── Détection des apps à redéployer ───────────────────────────────────────
  # Nx calcule les projets impactés depuis le DERNIER DÉPLOIEMENT RÉUSSI (tag
  # `deployed/prod`, déplacé par le job `mark-deployed`). Il suit les dépendances :
  # une modification de libs/shared redéploie aussi l'app et l'admin, ce que
  # l'ancien `git diff HEAD~1 | grep apps/...` ratait.
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      NX_NO_CLOUD: true
      NX_DAEMON: false
    outputs:
      angular: ${{ steps.affected.outputs.angular }}
      admin: ${{ steps.affected.outputs.admin }}
      api: ${{ steps.affected.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: affected
        run: |
          BASE=$(git rev-parse --verify -q 'refs/tags/deployed/prod^{commit}' || git rev-parse HEAD~1)
          echo "Base de comparaison : $BASE"
          PROJECTS=$(pnpm -s nx show projects --affected --base="$BASE" --head=HEAD --json)
          echo "Projets impactés : $PROJECTS"
          has() { echo "$PROJECTS" | grep -q "\"$1\""; }
          if has app-mytradingcoach; then echo "angular=true" >> "$GITHUB_OUTPUT"; else echo "angular=false" >> "$GITHUB_OUTPUT"; fi
          if has admin-mytradingcoach; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi
          # API (SCA-B0-08) : un commit landing seul ne doit plus redémarrer l'API. Nx ne rattache
          # ni prisma/ ni le bot Discord à un projet : on les teste en plus par chemin.
          API_PATHS='^(prisma/|libs/|scripts/discord-bot/|docker-compose\.(prod|discord-bot)\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          if has api-mytradingcoach || git diff --name-only "$BASE" HEAD | grep -qE "$API_PATHS"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy API → OVH VPS (Docker) ────────────────────────────────────────
  # Gel des déploiements API (jour J du référencement…) : variable de dépôt FREEZE_API_DEPLOY=true
  # (Settings → Secrets and variables → Actions → Variables). Les fronts continuent de partir.
  deploy-api:
    name: Deploy API to VPS
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' && vars.FREEZE_API_DEPLOY != 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/mytradingcoach/prod
            git fetch origin
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            export GIT_SHA=$(git rev-parse --short HEAD)   # → SENTRY_RELEASE (docker-compose.prod.yml)
            docker compose -f docker-compose.prod.yml --env-file .env.production build api
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate api
            # Garde-fou : l'API doit répondre prête (Postgres + Redis) sous 90 s, sinon le job échoue
            # et le tag deployed/prod ne bouge pas (le prochain CD recomparera depuis le bon commit).
            ready=0
            for i in $(seq 1 18); do
              if docker exec mtc_api_prod wget -qO- http://localhost:3000/api/health/ready >/dev/null 2>&1; then ready=1; break; fi
              sleep 5
            done
            if [ "$ready" != 1 ]; then
              echo "❌ API non prête après 90 s : derniers logs"
              docker logs --tail 80 mtc_api_prod
              exit 1
            fi
            echo "✅ API prête"
            docker compose -f docker-compose.discord-bot.yml --env-file .env.production build discord-bot
            docker compose -f docker-compose.discord-bot.yml --env-file .env.production up -d --force-recreate discord-bot
            docker buildx prune --keep-storage=8GB -f
            echo "Production deployment complete at $(date)"

  # ── Deploy Angular → VPS static ──────────────────────────────────────────
  deploy-angular:
    name: Deploy Angular prod to VPS
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.angular == 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Angular
        run: pnpm nx build app-mytradingcoach --configuration=production --skip-nx-cache

      - name: Verify build output
        run: |
          if [ ! -f "dist/apps/app-mytradingcoach/browser/index.html" ]; then
            echo "❌ build failed — index.html not found"
            exit 1
          fi
          echo "✅ build ok — $(du -sh dist/apps/app-mytradingcoach/browser/)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync Angular prod → VPS
        run: |
          rsync -az --delete dist/apps/app-mytradingcoach/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/app-prod/

  # ── Deploy Admin → VPS static ────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin to VPS
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm nx build admin-mytradingcoach --configuration=production --skip-nx-cache

      - name: Verify build output
        run: |
          if [ ! -f "dist/apps/admin-mytradingcoach/browser/index.html" ]; then
            echo "❌ build failed — index.html not found"
            exit 1
          fi
          echo "✅ build ok — $(du -sh dist/apps/admin-mytradingcoach/browser/)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync Admin → VPS
        run: |
          rsync -az --delete dist/apps/admin-mytradingcoach/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/admin/

  # ── Deploy Astro Landing → VPS static ────────────────────────────────────
  deploy-landing:
    name: Deploy Landing prod to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Astro landing
        run: pnpm nx build landing-mytradingcoach
        env:
          # Astro fige les flags au build : les pages /journal-trading-prop-firm et
          # /ambassadeur ne sont publiées (et entrent au sitemap) que si ON ici (PROMPT-173).
          PUBLIC_FEATURE_MULTI_ACCOUNTS: 'true'
          PUBLIC_FEATURE_REFERRAL: 'true'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync Landing prod → VPS
        run: |
          rsync -az --delete apps/landing-mytradingcoach/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/landing-prod/

  # ── Marque le commit comme déployé (base du prochain calcul `affected`) ───
  mark-deployed:
    name: Tag deployed/prod
    runs-on: ubuntu-latest
    needs: [changes, deploy-api, deploy-angular, deploy-admin, deploy-landing]
    # Les jobs sautés (app non modifiée) ne bloquent pas ; un échec, si. API modifiée mais gelée :
    # le tag ne bouge pas, sinon ces changements ne seraient jamais redéployés au dégel.
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && !(needs.changes.outputs.api == 'true' && vars.FREEZE_API_DEPLOY == 'true') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: |
          git tag -f deployed/prod
          git push -f origin refs/tags/deployed/prod
