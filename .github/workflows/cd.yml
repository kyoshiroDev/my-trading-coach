name: CD — Deploy to Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ── Détection des apps à redéployer ───────────────────────────────────────
  # Nx calcule les projets impactés depuis le DERNIER DÉPLOIEMENT RÉUSSI (tag
  # `deployed/prod`, déplacé par le job `mark-deployed`). Il suit les dépendances :
  # une modification de libs/shared redéploie aussi l'app et l'admin, ce que
  # l'ancien `git diff HEAD~1 | grep apps/...` ratait.
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Seulement une CI de push sur main de CE dépôt : une PR de fork dont la branche s'appelle `main`
    # déclencherait sinon la CD avec son propre commit et les secrets de prod (dépôt public, #1290).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    env:
      NX_NO_CLOUD: true
      NX_DAEMON: false
    outputs:
      angular: ${{ steps.affected.outputs.angular }}
      admin: ${{ steps.affected.outputs.admin }}
      api: ${{ steps.affected.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: affected
        run: |
          BASE=$(git rev-parse --verify -q 'refs/tags/deployed/prod^{commit}' || git rev-parse HEAD~1)
          echo "Base de comparaison : $BASE"
          PROJECTS=$(pnpm -s nx show projects --affected --base="$BASE" --head=HEAD --json)
          echo "Projets impactés : $PROJECTS"
          has() { echo "$PROJECTS" | grep -q "\"$1\""; }
          if has app-mytradingcoach; then echo "angular=true" >> "$GITHUB_OUTPUT"; else echo "angular=false" >> "$GITHUB_OUTPUT"; fi
          if has admin-mytradingcoach; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi
          # API (SCA-B0-08) : un commit landing seul ne doit plus redémarrer l'API. Nx ne rattache
          # ni prisma/ ni le bot Discord à un projet : on les teste en plus par chemin. Seule
          # libs/shared est importée par l'API : les libs front (libs/front/**) ne la redéploient pas (#1137).
          API_PATHS='^(prisma/|libs/shared/|scripts/discord-bot/|docker-compose\.(prod|discord-bot)\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          if has api-mytradingcoach || git diff --name-only "$BASE" HEAD | grep -qE "$API_PATHS"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy API → VPS PROD 149.202.40.240 (Docker) ───────────────────────
  # Secrets PROD_VPS_* : VPS dédié à la prod (migration 2026-10-15). VPS_HOST / VPS_SSH_KEY
  # restent ceux de l'ancien VPS (dev, beta, et landing/admin tant qu'ils ne sont pas sur Vercel).
  # Gel des déploiements API (jour J du référencement…) : variable de dépôt FREEZE_API_DEPLOY=true
  # (Settings → Secrets and variables → Actions → Variables). Les fronts continuent de partir.
  deploy-api:
    name: Deploy API to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' && vars.FREEZE_API_DEPLOY != 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      # Images API et bot construites ICI, sur le runner (#1290) : plus aucun build sur le VPS prod,
      # partagé avec un autre projet hébergé (4 Gio garantis, #1286). Envoi par infra/ci/ship-image.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # SHA court à 12 caractères calculé sur l'historique complet, comme sur le VPS

      - name: SHA de l'image
        id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # BuildKit tiré du miroir mirror.gcr.io : Docker Hub anonyme refuse les IP des runners.
      # Pas de cache type=gha : l'image API (~3 Gio) évincerait les caches pnpm/Playwright (10 Gio max).
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.35.1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build image API
        run: >-
          docker buildx build -f apps/api-mytradingcoach/Dockerfile
          -t mtc_api_prod:${{ steps.sha.outputs.short }}
          --output type=docker,dest=${{ runner.temp }}/api.tar .

      - name: Build image bot Discord
        run: >-
          docker buildx build -f scripts/discord-bot/Dockerfile
          -t mtc_discord_bot:${{ steps.sha.outputs.short }}
          --output type=docker,dest=${{ runner.temp }}/bot.tar scripts/discord-bot

      # Clé d'hôte épinglée (PROD_VPS_KNOWN_HOSTS), jamais de ssh-keyscan (fail2ban, 2026-10-16).
      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.PROD_VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "❌ secret PROD_VPS_KNOWN_HOSTS absent" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Envoyer les images au VPS prod
        env:
          VPS_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.PROD_VPS_HOST }}
        run: |
          bash infra/ci/ship-image.sh "${{ runner.temp }}/api.tar" "$VPS_TARGET"
          bash infra/ci/ship-image.sh "${{ runner.temp }}/bot.tar" "$VPS_TARGET"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ steps.sha.outputs.short }}
        with:
          command_timeout: 30m # migration + bascule blue/green (~3-5 min, plus de build)
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          envs: SHA
          script: |
            set -e
            cd /opt/apps/mytradingcoach/prod
            git fetch origin
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            # Blue/green sans coupure (SCA-B8, docs : .claude/agents/deploy.md) : image chargée à l'étape
            # précédente (DEPLOY_REQUIRE_IMAGE=1 : absente → échec, jamais de build sur le VPS), migration
            # unique, couleur inactive démarrée et vérifiée dans Traefik, drain de l'ancienne, worker
            # recréé. Échec avant le drain → l'ancienne n'a jamais cessé de servir, le job échoue et le
            # tag deployed/prod ne bouge pas.
            DEPLOY_REQUIRE_IMAGE=1 bash infra/deploy-api.sh prod "$SHA"
            # Bot : version en service gardée en :previous (retour arrière, api-deploiement.md), puis
            # la nouvelle en :latest, lancée sans rebuild.
            docker image inspect mtc_discord_bot:latest >/dev/null 2>&1 && docker tag mtc_discord_bot:latest mtc_discord_bot:previous
            docker tag "mtc_discord_bot:${SHA}" mtc_discord_bot:latest
            docker rmi "mtc_discord_bot:${SHA}" >/dev/null
            docker compose -f docker-compose.discord-bot.yml --env-file .env.production up -d --force-recreate --no-build discord-bot
            # Plus de prune de mtc-build ici : il ne construit plus en CD (cache figé), le prune du dimanche
            # (crontab) suffit, sans démarrer ses 1536 Mio à chaque déploiement (#1290).
            echo "Production deployment complete at $(date)"

  # ── Deploy Angular → VPS static ──────────────────────────────────────────
  deploy-angular:
    name: Deploy Angular prod to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.angular == 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Angular
        run: pnpm nx build app-mytradingcoach --configuration=production --skip-nx-cache

      - name: Verify build output
        run: |
          if [ ! -f "dist/apps/app-mytradingcoach/browser/index.html" ]; then
            echo "❌ build failed — index.html not found"
            exit 1
          fi
          echo "✅ build ok — $(du -sh dist/apps/app-mytradingcoach/browser/)"

      # Clé d'hôte épinglée (secret PROD_VPS_KNOWN_HOSTS) au lieu de ssh-keyscan : le scan ouvre
      # plusieurs connexions sans authentification, que fail2ban du VPS prod compte comme des échecs
      # → runner banni, rsync en « Connection timed out » (CD du 2026-10-16). Épingler la clé évite
      # aussi de faire confiance à la première clé reçue.
      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.PROD_VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "❌ secret PROD_VPS_KNOWN_HOSTS absent" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Release /opt/static/app-prod/releases/<sha> puis bascule atomique du lien current (SCA-B8-05)
      - name: Publier Angular prod → VPS
        env:
          VPS_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.PROD_VPS_HOST }}
        run: bash infra/deploy-static.sh app-prod dist/apps/app-mytradingcoach/browser/ ${{ github.event.workflow_run.head_sha }}

  # ── Deploy Admin → VPS static ────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm nx build admin-mytradingcoach --configuration=production --skip-nx-cache

      - name: Verify build output
        run: |
          if [ ! -f "dist/apps/admin-mytradingcoach/browser/index.html" ]; then
            echo "❌ build failed — index.html not found"
            exit 1
          fi
          echo "✅ build ok — $(du -sh dist/apps/admin-mytradingcoach/browser/)"

      # Clé d'hôte épinglée (DEV_VPS_KNOWN_HOSTS, ancien VPS) au lieu de ssh-keyscan : même
      # raison que pour le VPS prod (connexions sans authentification → runner banni par fail2ban).
      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "❌ secret DEV_VPS_KNOWN_HOSTS absent" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Release /opt/static/admin/releases/<sha> puis bascule atomique du lien current (SCA-B8-05)
      - name: Publier Admin → VPS
        env:
          VPS_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: bash infra/deploy-static.sh admin dist/apps/admin-mytradingcoach/browser/ ${{ github.event.workflow_run.head_sha }}

  # ── Deploy Astro Landing → VPS static ────────────────────────────────────
  deploy-landing:
    name: Deploy Landing prod to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Seulement une CI de push sur main de CE dépôt : une PR de fork dont la branche s'appelle `main`
    # déclencherait sinon la CD avec son propre commit et les secrets de prod (dépôt public, #1290).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # le commit validé par la CI, pas le dernier main

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Astro landing
        run: pnpm nx build landing-mytradingcoach
        env:
          # Astro fige les flags au build : les pages /journal-trading-prop-firm et
          # /ambassadeur ne sont publiées (et entrent au sitemap) que si ON ici (PROMPT-173).
          PUBLIC_FEATURE_MULTI_ACCOUNTS: 'true'
          PUBLIC_FEATURE_REFERRAL: 'true'
          # Propriété GA4 de prod (variable de dépôt, pas un secret). Vide → ni bandeau ni GA4.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      # Clé d'hôte épinglée (DEV_VPS_KNOWN_HOSTS, ancien VPS) au lieu de ssh-keyscan : même
      # raison que pour le VPS prod (connexions sans authentification → runner banni par fail2ban).
      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "❌ secret DEV_VPS_KNOWN_HOSTS absent" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Release /opt/static/landing-prod/releases/<sha> puis bascule atomique du lien current (SCA-B8-05)
      - name: Publier Landing prod → VPS
        env:
          VPS_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: bash infra/deploy-static.sh landing-prod apps/landing-mytradingcoach/dist/ ${{ github.event.workflow_run.head_sha }}

  # ── Marque le commit comme déployé (base du prochain calcul `affected`) ───
  mark-deployed:
    name: Tag deployed/prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, deploy-api, deploy-angular, deploy-admin, deploy-landing]
    # Les jobs sautés (app non modifiée) ne bloquent pas ; un échec, si. API modifiée mais gelée :
    # le tag ne bouge pas, sinon ces changements ne seraient jamais redéployés au dégel.
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && !(needs.changes.outputs.api == 'true' && vars.FREEZE_API_DEPLOY == 'true') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: |
          git tag -f deployed/prod
          git push -f origin refs/tags/deployed/prod
