name: Checks

# Vérifications communes (lint, typecheck, build, tests, smoke E2E), appelées par
# ci.yml et beta.yml. Une seule définition : modifier ici modifie les deux pipelines.
on:
  workflow_call:
    inputs:
      affected:
        description: "true = seulement les projets touchés depuis origin/main ; false = tout"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NX_NO_CLOUD: true

jobs:
  # ── Lint · typecheck · build ────────────────────────────────────────────────
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      DATABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
      # `affected` retombe sur `run-many --all` si le calcul échoue (ex. base introuvable).
      NX_SCOPE: ${{ inputs.affected && 'affected --base=origin/main --head=HEAD' || 'run-many --all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ github.sha }}
          restore-keys: |
            nx-
      # node_modules en cache, pas seulement le store pnpm : `cache: pnpm` sur setup-node
      # evite le TELECHARGEMENT mais pas le lien des paquets, qui coute 25 s par job.
      # Mesure du 2026-09-29 : 127 s cumulees sur les cinq jobs du pipeline.
      # La cle suit le lockfile : toute modification de dependance invalide le cache, et
      # `pnpm install` reste la pour rattraper un cache partiel ou absent.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate --config=./prisma/prisma.config.ts
      # Catalogue prop firm : schema.json (ajv) + contrôles métier. Synchronisé en base au
      # démarrage de l'API : un JSON invalide y serait refusé, autant le savoir avant.
      - name: Catalogue prop firm
        run: pnpm prop-firms:validate
      - name: Lint
        run: pnpm nx $NX_SCOPE --target=lint --parallel=3 || pnpm nx run-many --target=lint --all --parallel=3
      - name: Typecheck
        run: pnpm nx $NX_SCOPE --target=typecheck --parallel=3 || pnpm nx run-many --target=typecheck --all --parallel=3
      - name: Build
        run: pnpm nx $NX_SCOPE --target=build --parallel=3 || pnpm nx run-many --target=build --all --parallel=3

  # ── Tests API (couverture) + tests front et libs ────────────────────────────
  # Les deux suites vivaient dans deux jobs separes. Chaque job paie ~45 s d'amorcage
  # (checkout, setup-node, restauration des caches, install) avant de travailler, et
  # GitHub facture a la minute superieure : le job front consommait 2 minutes pour
  # 55 s de tests. Fusionnes, ils partagent un seul amorcage.
  # Les services postgres et redis ne servent qu'a l'API ; les tests front les ignorent.
  test-api:
    name: Tests API, front et libs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    env:
      DATABASE_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_test
      DATABASE_DIRECT_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: testpassword
      JWT_SECRET: test-jwt-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: test-refresh-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mytradingcoach_test
          POSTGRES_USER: mtc_user
          POSTGRES_PASSWORD: devpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Cache Nx (rempli par le job build)
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ github.sha }}
          restore-keys: |
            nx-
      # node_modules en cache, pas seulement le store pnpm : `cache: pnpm` sur setup-node
      # evite le TELECHARGEMENT mais pas le lien des paquets, qui coute 25 s par job.
      # Mesure du 2026-09-29 : 127 s cumulees sur les cinq jobs du pipeline.
      # La cle suit le lockfile : toute modification de dependance invalide le cache, et
      # `pnpm install` reste la pour rattraper un cache partiel ou absent.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate --config=./prisma/prisma.config.ts
      - name: Prisma migrate (test DB)
        run: pnpm exec prisma migrate deploy --config=./prisma/prisma.config.ts
      # `-c ci` active la couverture : échoue si trades, analytics, stripe ou auth passe sous 60 %.
      - name: Tests API
        run: pnpm nx test api-mytradingcoach -c ci
      # `always()` : une API en echec ne doit pas masquer l'etat du front. Les deux
      # resultats remontent dans le meme passage, au lieu d'exiger un second run.
      - name: Tests front et libs
        if: always()
        run: pnpm nx run-many --target=test --projects=app-mytradingcoach,admin-mytradingcoach,shared,front-ui,front-auth --parallel=2

  # ── Smoke E2E : parcours démo sur une base éphémère ─────────────────────────
  # Non bloquant (continue-on-error) tant qu'il n'a pas tenu deux semaines sans flake ;
  # ensuite, retirer `continue-on-error`.
  smoke-e2e:
    name: Smoke E2E (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_e2e
      DATABASE_DIRECT_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_e2e
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3001
      CORS_ORIGINS: http://localhost:4200
      JWT_SECRET: test-jwt-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: test-refresh-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test
      AI_ENABLED: 'false'
      # Valeurs factices : seul le boot les exige, le parcours démo n'appelle ni Stripe ni Resend.
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PREMIUM_PRICE_MONTHLY_V2: price_placeholder_monthly
      STRIPE_PREMIUM_PRICE_YEARLY_V2: price_placeholder_yearly
      STRIPE_PREMIUM_PRICE_MONTHLY_FOUNDER: price_placeholder_monthly_founder
      STRIPE_PREMIUM_PRICE_YEARLY_FOUNDER: price_placeholder_yearly_founder
      RESEND_API_KEY: re_placeholder
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mytradingcoach_e2e
          POSTGRES_USER: mtc_user
          POSTGRES_PASSWORD: devpassword
        options: >-
          --health-cmd "pg_isready -U mtc_user -d mytradingcoach_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Cache Nx (rempli par le job build)
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ github.sha }}
          restore-keys: |
            nx-
      # node_modules en cache, pas seulement le store pnpm : `cache: pnpm` sur setup-node
      # evite le TELECHARGEMENT mais pas le lien des paquets, qui coute 25 s par job.
      # Mesure du 2026-09-29 : 127 s cumulees sur les cinq jobs du pipeline.
      # La cle suit le lockfile : toute modification de dependance invalide le cache, et
      # `pnpm install` reste la pour rattraper un cache partiel ou absent.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Chromium en cache entre les runs (clé = lockfile, donc version de Playwright).
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Navigateur Playwright
        # Sans `--with-deps` : le runner Ubuntu a déjà les bibliothèques de Chromium, et cette option
        # tirait 32 Mo de polices du miroir apt d'Azure à ~100 Ko/s (bloqué > 5 min, le 07/10/2026).
        # Le navigateur vient du CDN Playwright (rapide), ou du cache ci-dessus.
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Base éphémère (migrations + compte démo)
        run: |
          pnpm exec prisma generate --config=./prisma/prisma.config.ts
          pnpm exec prisma migrate deploy --config=./prisma/prisma.config.ts
          pnpm seed:demo
      # `serve-static` et non `serve` : le serveur de developpement Angular demarre a froid
      # en CI et depassait les 180 s d'attente, ce qui faisait echouer ce job a CHAQUE fois
      # sans jamais lancer un seul test, pour 6 minutes facturees. `serve-static` sert l'app
      # compilee (repli SPA inclus) : plus rapide et deterministe.
      #
      # Build `local` (pas la configuration par defaut `development`) : `development` remplace
      # environment.ts par environment.dev.ts, et l'app appelait alors l'API de DEV du VPS au
      # lieu de l'API demarree ici. API dev tombee = smoke rouge sans rapport avec la branche
      # (2026-10-03). `local` garde environment.ts → http://localhost:3001/api.
      #
      # Les deux services sont attendus SEPAREMENT : « API ou app non demarree » ne disait
      # pas laquelle, et le `tail -50` echouait (« option used in invalid context »), donc
      # aucun journal ne remontait. On ne pouvait pas diagnostiquer.
      - name: Démarrer l'API
        run: |
          pnpm nx build api-mytradingcoach --configuration=development
          nohup node apps/api-mytradingcoach/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:3001/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::API non démarrée après 120 s"; tail -n 80 api.log; exit 1
      - name: Démarrer l'app (compilée)
        run: |
          nohup pnpm nx serve-static app-mytradingcoach --buildTarget=app-mytradingcoach:build:local > app.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf localhost:4200 > /dev/null && exit 0
            sleep 2
          done
          echo "::error::App non démarrée après 240 s"; tail -n 80 app.log; exit 1
      - name: Smoke démo (dashboard, journal, analytics)
        run: pnpm exec playwright test smoke
        working-directory: apps/app-mytradingcoach-e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e
          path: |
            apps/app-mytradingcoach-e2e/test-results
            api.log
            app.log
          retention-days: 7
