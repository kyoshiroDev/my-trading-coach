name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Commitlint (PRs uniquement) ───────────────────────────────────────────
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── Lint (Nx Cloud affected) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint nx affected
        run: |
          pnpm nx affected --target=lint --base=origin/main --head=HEAD --parallel=3 \
          || pnpm nx run-many --target=lint --all --parallel=3

  # ── Build (Nx Cloud affected) ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      DATABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --config=./prisma/prisma.config.ts

      - name: typecheck nx affected
        run: |
          pnpm nx affected --target=typecheck --base=origin/main --head=HEAD --parallel=3 \
          || pnpm nx run-many --target=typecheck --all --parallel=3

      - name: build nx affected
        run: |
          pnpm nx affected --target=build --base=origin/main --head=HEAD --parallel=3 \
          || pnpm nx run-many --target=build --all --parallel=3


  # ── Build & Check Astro Landing (toujours, pas affected) ─────────────────
  build-landing:
    name: Build Astro Landing
    runs-on: ubuntu-latest
    needs: lint
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Astro check (typecheck)
        run: pnpm nx lint landing-mytradingcoach

      - name: Astro build
        run: pnpm nx build landing-mytradingcoach
        env:
          # Flags multi-comptes / parrainage ON au build (PROMPT-173) : sinon les pages
          # /journal-trading-prop-firm et /ambassadeur redirigent vers / et sortent du sitemap.
          PUBLIC_FEATURE_MULTI_ACCOUNTS: 'true'
          PUBLIC_FEATURE_REFERRAL: 'true'

  # ── Tests Angular ─────────────────────────────────────────────────────────
  test-angular:
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: test front + shared (app, admin, libs/shared)
        run: pnpm nx run-many --target=test --projects=app-mytradingcoach,admin-mytradingcoach,shared,front-ui,front-auth --parallel=2

  # ── Tests API (NestJS + Prisma + services) ────────────────────────────────
  test-api:
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
      DATABASE_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_test
      DATABASE_DIRECT_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: testpassword
      JWT_SECRET: test-jwt-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: test-refresh-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mytradingcoach_test
          POSTGRES_USER: mtc_user
          POSTGRES_PASSWORD: devpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --config=./prisma/prisma.config.ts

      - name: Prisma migrate (test DB)
        run: pnpm exec prisma migrate deploy --config=./prisma/prisma.config.ts

      - name: test api
        run: pnpm nx test api-mytradingcoach --parallel=2

  # ── Intégration parrainage : webhook signé → BullMQ → Postgres ────────────
  # Déterministe et sans dépendance externe : le test SIGNE lui-même l'événement
  # avec STRIPE_WEBHOOK_SECRET, que l'API utilise pour vérifier — donc ni Stripe CLI
  # (`stripe listen`, impossible à joindre sur un runner éphémère) ni compte Stripe.
  # Vérifie la règle de coexistence : ambassadeur → 20 % sans mois offert,
  # parrain normal → mois offert sans 20 %, auto-parrainage → rien.
  # Le test Playwright qui clique dans la vraie page Stripe reste MANUEL
  # (cf. apps/app-mytradingcoach-e2e/README.md) : trop lent et trop fragile ici.
  integration-referral:
    name: Intégration parrainage (webhook signé)
    runs-on: ubuntu-latest
    needs: build
    # STRIPE_SECRET_KEY_TEST vit dans l'environment `development` (comme les secrets
    # VPS et E2E_*), pas au niveau dépôt : sans cette ligne le secret serait vide et
    # l'étape de vérification échouerait. Aucune règle de protection sur cet
    # environment, donc pas d'approbation manuelle à attendre.
    environment: development
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true
      DATABASE_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_int
      DATABASE_DIRECT_URL: postgresql://mtc_user:devpassword@localhost:5432/mytradingcoach_int
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: test-refresh-secret-64-chars-minimum-xxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test
      AI_ENABLED: 'false'
      # Secret de signature partagé test ↔ API : le test signe l'événement, l'API le
      # vérifie avec la même valeur. Ce n'est PAS un vrai `whsec_` Stripe, aucun
      # `stripe listen` n'est nécessaire.
      STRIPE_WEBHOOK_SECRET: whsec_ci_signature_partagee_test_only
      # En revanche la clé Stripe doit être une VRAIE clé de test. `processWebhookEvent`
      # appelle `syncSubscription` AVANT `processReferral` ; celle-ci absorbe un
      # StripeInvalidRequestError (abonnement inconnu → normal ici) mais RELANCE un
      # StripeAuthenticationError. Avec une clé bidon, la commission n'est donc jamais
      # écrite et les tests expirent. Vérifié en reproduisant cet env en local.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      # Ces trois-là ne servent qu'à satisfaire les `getOrThrow` du boot d'AppModule :
      # aucun appel réel ne les utilise dans ce test.
      STRIPE_PREMIUM_PRICE_MONTHLY_V2: price_ci_placeholder_monthly
      STRIPE_PREMIUM_PRICE_YEARLY_V2: price_ci_placeholder_yearly
      RESEND_API_KEY: re_ci_placeholder

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mytradingcoach_int
          POSTGRES_USER: mtc_user
          POSTGRES_PASSWORD: devpassword
        options: >-
          --health-cmd "pg_isready -U mtc_user -d mytradingcoach_int"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Échoue vite et clairement plutôt que de laisser les tests expirer en 30 s
      # sur un timeout opaque, ou pire, de « passer » sans rien vérifier.
      - name: Vérifier le secret Stripe de test
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error title=Secret manquant::Ajouter le secret de dépôt STRIPE_SECRET_KEY_TEST (une clé sk_test_… du compte Stripe de test). Sans elle, syncSubscription leve une StripeAuthenticationError et la commission n'est jamais ecrite : ce job ne verifierait plus rien."
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) echo "Clé Stripe de TEST détectée." ;;
            *) echo "::error title=Clé non-test::STRIPE_SECRET_KEY_TEST doit commencer par sk_test_. Jamais de cle LIVE en CI."; exit 1 ;;
          esac

      - name: Prisma generate
        run: pnpm exec prisma generate --config=./prisma/prisma.config.ts

      - name: Prisma migrate (base d'intégration)
        run: pnpm exec prisma migrate deploy --config=./prisma/prisma.config.ts

      - name: Intégration parrainage
        run: pnpm exec vitest run --config vitest.integration.config.mts
        working-directory: apps/api-mytradingcoach

  # ── Deploy API dev → VPS (port 3001 via traefik) ──────────────────────────
  deploy-api-dev:
    name: Deploy API dev to VPS
    runs-on: ubuntu-latest
    needs: [test-angular, test-api]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - name: Deploy via SSH (dev)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/mytradingcoach/dev
            git fetch origin
            git reset --hard origin/dev
            docker compose -f docker-compose.dev.yml --env-file .env.dev build api
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --force-recreate api
            docker buildx prune --keep-storage=8GB -f
            echo "Dev API deployment complete at $(date)"

  # ── Deploy Angular app dev → VPS static ──────────────────────────────────
  deploy-app-dev:
    name: Deploy Angular dev to VPS
    runs-on: ubuntu-latest
    needs: [test-angular, test-api]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Angular (dev)
        run: pnpm nx build app-mytradingcoach --configuration=development --skip-nx-cache

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync Angular dev → VPS
        run: |
          rsync -az --delete dist/apps/app-mytradingcoach/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/app-dev/

  # ── Deploy Astro landing dev → VPS static ────────────────────────────────
  deploy-landing-dev:
    name: Deploy Landing dev to VPS
    runs-on: ubuntu-latest
    needs: [build-landing]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_NO_CLOUD: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Astro landing (dev)
        run: pnpm nx build landing-mytradingcoach
        env:
          PUBLIC_APP_URL: https://dev.app.mytradingcoach.app
          PUBLIC_API_URL: https://dev.api.mytradingcoach.app/api
          PUBLIC_FEATURE_MULTI_ACCOUNTS: 'true'
          PUBLIC_FEATURE_REFERRAL: 'true'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync Landing dev → VPS
        run: |
          rsync -az --delete apps/landing-mytradingcoach/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/static/landing-dev/
