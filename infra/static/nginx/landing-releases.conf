# Landing Astro servie depuis des releases (SCA-B8-05).
# Copie de référence : sur le VPS, /opt/infra/static/nginx/landing-releases.conf (partagée par
# mtc_landing_prod et mtc_landing_dev). Le dossier du site est monté sur /usr/share/nginx/html ;
# current et previous sont des liens relatifs vers releases/<sha>.
server {
    listen 80;
    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Redirection portee de vercel.json (mort) : /confidentialite -> /politique-confidentialite
    location = /confidentialite {
        return 301 https://www.mytradingcoach.app/politique-confidentialite;
    }

    # URL canonique unique (astro trailingSlash: 'never') : tout slash final -> sans slash.
    # La racine `/` n'est pas concernee (le motif exige au moins un caractere avant le slash final).
    location ~ ^/(.+)/$ {
        return 301 https://www.mytradingcoach.app/$1;
    }

    # Assets Astro hashed — cache immuable 1 an, repli sur la version precedente (page ouverte
    # avant la bascule).
    location /_astro/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /current$uri /previous$uri =404;
    }

    # Pages statiques Astro : sortie en page/index.html -> servir /page depuis /page/index.html
    # SANS le 301 de dossier de nginx (pas de `$uri/` nu qui force le slash final).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }

    # Page 404 brandee servie comme document d'erreur (preserve le statut HTTP 404)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
