# Landing Astro servie depuis des releases (SCA-B8-05).
# Copie de référence : sur le VPS, /opt/infra/static/nginx/landing-releases.conf (partagée par
# mtc_landing_prod et mtc_landing_dev). Le dossier du site est monté sur /usr/share/nginx/html ;
# current et previous sont des liens relatifs vers releases/<sha>.
server {
    listen 80;
    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    # Fichiers précompressés par infra/deploy-static.sh (SCA-B7-03) : servis tels quels, sans
    # recompresser à chaque requête. Pas de .gz → compression à la volée, comme avant.
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache des descripteurs de fichiers (SCA-B7-03, #482) : évite open()/stat() à chaque requête.
    # Validité courte (10 s) : après la bascule du lien `current`, l'ancienne version peut encore être
    # servie au plus 10 s (ses fichiers restent dans `previous`). Fichiers absents jamais mis en cache.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Redirection portee de vercel.json (mort) : /confidentialite -> /politique-confidentialite.
    # Location relative et query string conservee (L2 #1067) : avant, l'URL de prod en dur envoyait
    # dev vers la prod et perdait utm_*, ref, promo.
    location = /confidentialite {
        absolute_redirect off;
        return 301 /politique-confidentialite$is_args$args;
    }

    # REDIRECTION TEMPORAIRE DE L'ACCUEIL (2026-11-08, newsletter NinjaTrader) : `/` -> /prop-firm,
    # query string conservee (utm_*, ref, promo, internal...). 302 (temporaire), jamais mise en cache.
    # `absolute_redirect off` : Location relative (/prop-firm?...), sinon nginx, en http derriere
    # Traefik, ecrirait http://<hote>/prop-firm ; et la regle vaut pour prod ET dev (conf partagee).
    # L'ancienne accueil est sur /accueil (noindex). Retrait : supprimer ces deux blocs, reecrire le
    # fichier en place, nginx -t, nginx -s reload (deploy.md, « Redirection temporaire de l'accueil »).
    location = / {
        absolute_redirect off;
        return 302 /prop-firm$is_args$args;
    }
    location = /index.html {
        absolute_redirect off;
        return 302 /prop-firm$is_args$args;
    }

    # URL canonique unique (astro trailingSlash: 'never') : tout slash final -> sans slash.
    # La racine `/` n'est pas concernee (le motif exige au moins un caractere avant le slash final).
    # Location relative (meme hote : prod reste en prod, dev en dev) et query string conservee
    # (utm_*, ref, promo, L2 #1067). `absolute_redirect off` : sinon nginx, en http derriere Traefik,
    # ecrirait http://<hote>/... (meme raison que la 302 de l'accueil).
    # LISTE BLANCHE OBLIGATOIRE : nginx decode %5C en `\` avant la capture ; avec `(.+)`,
    # /%5Cevil.com/ donnait `Location: /\evil.com`, lu par les navigateurs comme //evil.com
    # (redirection ouverte). Capture limitee aux caracteres d'un slug, 1er caractere alphanumerique :
    # le reste tombe en 404.
    location ~ "^/([A-Za-z0-9][A-Za-z0-9/_.-]*)/$" {
        absolute_redirect off;
        return 301 /$1$is_args$args;
    }

    # Assets Astro hashed (build.assets: '_assets' dans astro.config) — cache immuable 1 an, repli
    # sur la version precedente (page ouverte avant la bascule). L'ancienne landing.conf visait
    # /_astro/, dossier qui n'existe pas : ces assets n'etaient caches qu'une heure.
    location /_assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /current$uri /previous$uri =404;
    }

    # Pages statiques Astro : sortie en page/index.html -> servir /page depuis /page/index.html
    # SANS le 301 de dossier de nginx (pas de `$uri/` nu qui force le slash final).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }

    # Page 404 brandee servie comme document d'erreur (preserve le statut HTTP 404)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
