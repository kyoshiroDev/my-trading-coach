# App Angular et admin (SPA) servies depuis des releases (SCA-B8-05).
# Copie de référence : sur le VPS, /opt/infra/static/nginx/spa-releases.conf (montée par les
# conteneurs de /opt/infra/static/docker-compose.yml). Le dossier du site est monté sur
# /usr/share/nginx/html ; current et previous sont des liens relatifs vers releases/<sha>.
server {
    listen 80;
    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    # Fichiers précompressés par infra/deploy-static.sh (SCA-B7-03) : servis tels quels, sans
    # recompresser à chaque requête. Pas de .gz → compression à la volée, comme avant.
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache des descripteurs de fichiers (SCA-B7-03, #482) : évite open()/stat() à chaque requête.
    # Validité courte (10 s) : après la bascule du lien `current`, l'ancienne version peut encore être
    # servie au plus 10 s (ses fichiers restent dans `previous`). Fichiers absents jamais mis en cache.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Service worker Angular (PWA admin) : jamais en cache, sinon le navigateur garde l'ancien SW et
    # n'applique plus aucune mise à jour. Ces `location =` passent avant la règle des .js ci-dessous.
    # (ngsw.json et manifest.webmanifest tombent déjà dans `location /`, en no-cache.)
    location = /ngsw-worker.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /safety-worker.js  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Assets Angular hashed — cache immuable 1 an. Repli sur la version précédente : un onglet
    # ouvert avant la bascule charge encore ses chunks paresseux (sinon ChunkLoadError).
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|webp|avif|png|jpg|svg)$ {
        root /usr/share/nginx/html;
        # Un seul en-tête (avant : `expires 1y` + add_header → deux Cache-Control).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files /current$uri /previous$uri =404;
    }

    # SPA : toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}
