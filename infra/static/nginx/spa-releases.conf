# App Angular et admin (SPA) servies depuis des releases (SCA-B8-05).
# Copie de référence : sur le VPS, /opt/infra/static/nginx/spa-releases.conf (montée par les
# conteneurs de /opt/infra/static/docker-compose.yml). Le dossier du site est monté sur
# /usr/share/nginx/html ; current et previous sont des liens relatifs vers releases/<sha>.
server {
    listen 80;
    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    # Fichiers précompressés par infra/deploy-static.sh (SCA-B7-03) : servis tels quels, sans
    # recompresser à chaque requête. Pas de .gz → compression à la volée, comme avant.
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache des descripteurs de fichiers (SCA-B7-03, #482) : évite open()/stat() à chaque requête.
    # Validité courte (10 s) : après la bascule du lien `current`, l'ancienne version peut encore être
    # servie au plus 10 s (ses fichiers restent dans `previous`). Fichiers absents jamais mis en cache.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Service worker Angular (PWA admin) : jamais en cache, sinon le navigateur garde l'ancien SW et
    # n'applique plus aucune mise à jour. Ces `location =` passent avant la règle des .js ci-dessous.
    # (ngsw.json tombe déjà dans `location /`, en no-cache.)
    location = /ngsw-worker.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /safety-worker.js  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Service worker du push de l'app (#666) : nom fixe, jamais en cache (sans cette règle, celle des
    # .js ci-dessous lui donnait un cache immuable d'un an).
    location = /push-sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Manifest PWA (app et admin) : bon type MIME, cache court (le navigateur le relit pour mettre à
    # jour nom, couleurs et icônes de l'app installée). Absent → 404, pas l'index.html de la SPA.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Assets Angular hashed — cache immuable 1 an. Repli sur la version précédente : un onglet
    # ouvert avant la bascule charge encore ses chunks paresseux (sinon ChunkLoadError).
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|webp|avif|png|jpg|svg)$ {
        root /usr/share/nginx/html;
        # Un seul en-tête (avant : `expires 1y` + add_header → deux Cache-Control).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files /current$uri /previous$uri =404;
    }

    # SPA : toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        # CSP (#1068, défense en profondeur après la XSS S1 du lot 4a) : une seule politique pour
        # l'app (prod, dev, beta) et l'admin, qui partagent cette conf. Posée sur index.html seulement
        # (les autres fichiers ne sont pas des documents). Bloquante depuis la phase 2 (#1068) : un script,
        # une frame ou un appel réseau hors de cette liste est refusé par le navigateur. Phase 1 en
        # Report-Only du 21 au 22/11 : app (dev.app, paiement test compris) et admin relevés sans violation.
        # Urgence sur un VPS : remettre le suffixe `-Report-Only` à l'en-tête (plus rien de bloqué) par réécriture
        # EN PLACE (même inode, `cat … >`, jamais `sed -i`), puis nginx -t, reload et contrôle dans chaque
        # conteneur : commandes exactes dans .claude/reference/deploy/fronts-statiques.md (paragraphe CSP).
        # Dans le dépôt, csp-nginx.spec.ts exige le mode bloquant.
        # - img-src garde `https:` : logo des e-mails (app./dev.app.), visuel du tirage (api.), images de
        #   Stripe et de Google ; une liste fermée casserait une image sans gain notable.
        # - script-src : 'sha256-FmLW…' = script inline `mtc-register-view` de l'index de l'app
        #   (à recalculer à chaque modification du script : verrouillé par csp-nginx.spec.ts) ;
        #   'unsafe-hashes' + 'sha256-Mht…' = `onload="this.media='all'"` des feuilles de style
        #   (CSS critique inliné par le build, polices de l'admin) ; script Google chargé à la demande.
        # - connect-src : API et WebSocket des trois environnements, plus le bouton Google.
        # - Stripe (page de paiement intégrée, Checkout Elements : Payment Element + Express Checkout) :
        #   origines de la doc Stripe « Content Security Policy > Stripe.js » ; hooks.stripe.com = 3D Secure.
        #   Relevé en ligne sur dev.app le 21/11 (Report-Only) : stripe.js et ses frames n'étaient pas autorisés.
        #   fonts.googleapis.com en connect-src : Stripe Elements lit la feuille de police de la page
        #   (doc Stripe : « CSS file to load web fonts », relevé au paiement test du 22/11).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FmLW8jBCP4y5VR4X3td+JgahkDnuQsoueatSHPbokM8=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=' https://accounts.google.com/gsi/client https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.mytradingcoach.app wss://api.mytradingcoach.app https://dev.api.mytradingcoach.app wss://dev.api.mytradingcoach.app https://beta.api.mytradingcoach.app wss://beta.api.mytradingcoach.app https://accounts.google.com/gsi/ https://api.stripe.com https://fonts.googleapis.com; frame-src https://accounts.google.com/gsi/ https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }
}
