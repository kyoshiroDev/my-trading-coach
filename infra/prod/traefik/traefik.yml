# Traefik — VPS prod MyTradingCoach (149.202.40.240)
# Pas de dashboard exposé : en cas de besoin, tunnel SSH vers le port 8080 du conteneur.
# Le serveur contient en plus un résolveur ACME secondaire et un docker-compose.override.yml (réseaux)
# propres à un autre projet hébergé. Ne jamais les supprimer ni les recopier ici.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false

ping:
  entryPoint: ping

entryPoints:
  ping:
    address: ":8082"
    http:
      # Même réglage que web et websecure (avertissement Traefik sinon) ; sonde interne seulement.
      aliasHeadersStrategy: delete
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
      # En-têtes de requête dont le nom contient autre chose que lettres, chiffres, tirets (X_Auth_User…)
      # supprimés : pas d'usurpation d'en-tête. Entrypoint partagé : vaut aussi pour l'autre projet hébergé.
      aliasHeadersStrategy: delete
      # Chemins avec caractères encodés refusés en 400 (split-view, avertissement Traefik v3.6.7+).
      # Seul le chemin est contrôlé, pas la query. Entrypoint partagé : vaut aussi pour l'autre projet hébergé.
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      # Pas de middleware ici : entrypoint partagé avec un autre projet hébergé ; chaque routeur MTC
      # déclare security-headers@file.
      # En-têtes de requête dont le nom contient autre chose que lettres, chiffres, tirets (X_Auth_User…)
      # supprimés : pas d'usurpation d'en-tête. Entrypoint partagé : vaut aussi pour l'autre projet hébergé.
      aliasHeadersStrategy: delete
      # Chemins avec caractères encodés refusés en 400 (split-view, avertissement Traefik v3.6.7+).
      # Seul le chemin est contrôlé, pas la query. Entrypoint partagé : vaut aussi pour l'autre projet hébergé.
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 120s
        idleTimeout: 180s

certificatesResolvers:
  letsencrypt:
    acme:
      email: hello@mytradingcoach.app
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: ovh
        resolvers:
          - "213.186.33.99:53"
        propagation:
          delayBeforeChecks: 10s

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: mtc_network
  file:
    directory: /conf.d
    watch: true

log:
  level: INFO

accessLog:
  bufferingSize: 100
