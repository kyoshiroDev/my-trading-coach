# API prod — déploiement blue/green (SCA-B8-03). Ne pas lancer `up` à la main sur tout le fichier :
# passer par `infra/deploy-api.sh prod`, qui construit l'image, migre, démarre la couleur inactive,
# vérifie qu'elle reçoit du trafic, puis draine l'ancienne (voir .claude/agents/deploy.md).
#
# - api_blue / api_green : web (APP_ROLE=web), derrière le même service Traefik `api-prod` (routeur `api-prod-secure`). Une seule
#   couleur tourne hors déploiement ; les deux ~1 min pendant la bascule.
# - worker : crons + files BullMQ (APP_ROLE=worker), sans route Traefik, redémarré simplement.
# Les images sont taguées par SHA (`mtc_api_prod:<sha>`) ; `:blue`, `:green`, `:worker` et `:latest`
# pointent sur la version que porte chaque conteneur.

x-api: &api
  restart: unless-stopped
  env_file: .env.production
  networks:
    - mtc_network
  # Laisse aux workers le temps de finir leurs requêtes et de fermer Redis/Prisma/BullMQ.
  stop_grace_period: 30s
  # Descripteurs de fichiers (sockets compris) : Docker donne 1 024 par défaut, que Node ne relève
  # pas tout seul (SCA-B7-01, #481). Traefik, en Go, monte déjà de lui-même au plafond (524 288).
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  # Drain (deploy-api.sh) : /tmp/drain rend le conteneur « unhealthy » → Traefik ne lui envoie plus
  # rien, puis il est arrêté. start_interval : sain en quelques secondes au démarrage.
  healthcheck:
    test: ["CMD-SHELL", "[ ! -f /tmp/drain ] && wget -qO- http://localhost:3000/api/health >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 90s
    start_interval: 2s

x-api-env: &api-env
  TZ: Europe/Paris
  # Plafond de tas V8 par process : un worker qui dérape meurt seul (relancé par le primaire)
  # au lieu de pousser tout le conteneur à l'OOM (audit scalabilité C1).
  NODE_OPTIONS: --max-old-space-size=384
  # Migrations lancées une fois par deploy-api.sh avant la bascule (SCA-B8-02).
  RUN_MIGRATIONS: "false"
  # Version déployée, remontée à Sentry (GIT_SHA exporté par deploy-api.sh ; vide en lancement manuel).
  SENTRY_RELEASE: ${GIT_SHA:-}
  # Environnement Sentry posé en clair : ne dépend plus de NODE_ENV (repli d'instrument.ts).
  SENTRY_ENVIRONMENT: production

x-web-labels: &web-labels
  - "traefik.enable=true"
  # Routeur `api-prod-secure` (et non plus `api-prod`) : les en-têtes de sécurité sont déclarés ici,
  # routeur par routeur, car l'entrypoint websecure est partagé avec un autre projet hébergé sur le
  # VPS et ne porte plus de middleware. Le renommage rend la bascule sûre : pendant le blue/green,
  # l'ancienne couleur garde `api-prod` sans middleware et la nouvelle déclare `api-prod-secure`
  # avec ; deux routeurs distincts sur le même service, aucun conflit de définition.
  - "traefik.http.routers.api-prod-secure.rule=Host(`api.mytradingcoach.app`)"
  - "traefik.http.routers.api-prod-secure.entrypoints=websecure"
  - "traefik.http.routers.api-prod-secure.tls.certresolver=letsencrypt"
  - "traefik.http.routers.api-prod-secure.middlewares=security-headers@file"
  # Labels identiques sur les deux couleurs (et au conteneur unique d'avant B8) : Traefik fusionne
  # les conteneurs d'un même service. Un routeur défini différemment par deux conteneurs serait
  # rejeté par Traefik → coupure. Ne jamais faire diverger ces labels entre couleurs.
  - "traefik.http.services.api-prod.loadbalancer.server.port=3000"

services:
  api_blue:
    <<: *api
    image: mtc_api_prod:blue
    container_name: mtc_api_prod_blue
    environment:
      <<: *api-env
      APP_ROLE: web
      # VPS partagé avec un autre projet : 2 workers au lieu de 3 (défaut `min(cœurs, 3)`).
      WEB_CONCURRENCY: "2"
    # 2 workers × 384 Mo de tas + primaire + mémoire native (argon2, Chromium) : 1,5 Gio
    # (pic mesuré 766 Mio à 3 workers sans charge, 2026-11-24).
    mem_limit: 1536m
    memswap_limit: 1536m
    labels: *web-labels

  api_green:
    <<: *api
    image: mtc_api_prod:green
    container_name: mtc_api_prod_green
    environment:
      <<: *api-env
      APP_ROLE: web
      WEB_CONCURRENCY: "2"
    mem_limit: 1536m
    memswap_limit: 1536m
    labels: *web-labels

  worker:
    <<: *api
    image: mtc_api_prod:worker
    container_name: mtc_api_prod_worker
    environment:
      <<: *api-env
      APP_ROLE: worker
      # Un seul process : il porte les crons (worker cron du cluster) et les files.
      WEB_CONCURRENCY: "1"
    # Pic mesuré 350 Mio (2026-11-24).
    mem_limit: 768m
    memswap_limit: 768m
    labels:
      - "traefik.enable=false"

networks:
  mtc_network:
    external: true
