services:
  api:
    build:
      context: .
      dockerfile: apps/api-mytradingcoach/Dockerfile
    image: mtc_api_prod:latest
    container_name: mtc_api_prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      - TZ=Europe/Paris
      # Plafond de tas V8 par process : un worker qui dérape meurt seul (relancé par le primaire)
      # au lieu de pousser tout le conteneur à l'OOM (audit scalabilité C1).
      - NODE_OPTIONS=--max-old-space-size=384
      # Version déployée, remontée à Sentry (GIT_SHA exporté par le CD ; vide en build manuel).
      - SENTRY_RELEASE=${GIT_SHA:-}
    networks:
      - mtc_network
    # 3 workers × 384 Mo de tas + primaire + mémoire native (argon2, Chromium) : 2 Gio.
    mem_limit: 2g
    memswap_limit: 2g
    # Laisse aux workers le temps de finir leurs requêtes et de fermer Redis/Prisma/BullMQ.
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-prod.rule=Host(`api.mytradingcoach.app`)"
      - "traefik.http.routers.api-prod.entrypoints=websecure"
      - "traefik.http.routers.api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-prod.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mtc_network:
    external: true
