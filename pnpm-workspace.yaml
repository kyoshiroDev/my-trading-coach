packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'

# pnpm >= 11 ne lit plus "shamefully-hoist" depuis .npmrc — migré ici.
# Requis : du code app importe des deps non déclarées (ex. zod, dép fantôme)
# qui doivent être hoistées à la racine de node_modules.
shamefullyHoist: true

# Réglages migrés depuis le champ "pnpm" de package.json : pnpm >= 11 ne lit plus
# ce champ et attend ces clés ici. Valeurs identiques à celles ayant généré le
# lockfile (sinon mismatch / dé-pinning NestJS — cf. note "NestJS version pinning").
overrides:
  'path-to-regexp@>=8.0.0 <8.4.0': '>=8.4.0'
  'axios@<1.18.0': '>=1.18.0'
  'shell-quote@<1.8.4': '>=1.8.4'
  '@babel/plugin-transform-modules-systemjs@<7.29.4': '>=7.29.4'
  'picomatch@4': '^4.0.4'
  'lodash@<4.18.0': '>=4.18.0'
  # Correctifs de sécurité transitifs (audit du 2026-09-13) : NestJS 11.2.3 embarque encore
  # multer 2.2.0, socket.io 4.8.3 tire ws / socket.io-parser vulnérables. Planchers bornés à la
  # même majeure pour ne rien casser.
  'multer@>=2.0.0 <2.3.0': '^2.3.0'
  'ws@>=8.0.0 <8.21.0': '^8.21.0'
  'socket.io-parser@>=4.0.0 <4.2.7': '^4.2.7'
  'form-data@>=4.0.0 <4.0.6': '^4.0.6'
  # Outillage (CLI Prisma via @nestjs/terminus, puppeteer, chaîne de build Astro) : planchers
  # dans la même majeure. Hors périmètre : sharp 0.35, deepmerge-ts 8, extract-zip / image-size
  # (aucun correctif publié), Astro (critique corrigée en 7.2.8 → montée majeure).
  'fast-uri@>=3.0.0 <3.1.6': '^3.1.6'
  'mysql2@>=3.0.0 <3.22.0': '^3.22.0'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'vite@>=7.0.0 <7.3.5': '^7.3.5'
  'postcss@>=8.0.0 <8.5.18': '^8.5.18'
  'svgo@>=4.0.0 <4.1.0': '^4.1.0'
  'nanoid@>=3.0.0 <3.3.18': '^3.3.18'
  'immutable@>=5.0.0 <5.1.8': '^5.1.8'
  'smol-toml@>=1.0.0 <1.7.1': '^1.7.1'
  # NestJS épinglé en bloc (core + common + platform-express), cf. note « NestJS version pinning ».
  '@nestjs/core': '11.2.3'
  '@nestjs/common': '11.2.3'
  '@nestjs/platform-express': '11.2.3'

packageExtensions:
  '@nestjs/schedule':
    peerDependencies:
      '@nestjs/platform-express': '*'
      '@nestjs/websockets': '*'
    peerDependenciesMeta:
      '@nestjs/platform-express':
        optional: true
      '@nestjs/websockets':
        optional: true
  '@nestjs/bullmq':
    peerDependencies:
      '@nestjs/platform-express': '*'
      '@nestjs/websockets': '*'
    peerDependenciesMeta:
      '@nestjs/platform-express':
        optional: true
      '@nestjs/websockets':
        optional: true
  '@nestjs/bull-shared':
    peerDependencies:
      '@nestjs/platform-express': '*'
      '@nestjs/websockets': '*'
    peerDependenciesMeta:
      '@nestjs/platform-express':
        optional: true
      '@nestjs/websockets':
        optional: true
  '@nestjs/throttler':
    peerDependencies:
      '@nestjs/platform-express': '*'
      '@nestjs/websockets': '*'
    peerDependenciesMeta:
      '@nestjs/platform-express':
        optional: true
      '@nestjs/websockets':
        optional: true
  '@sentry/nestjs':
    peerDependencies:
      '@nestjs/platform-express': '*'
      '@nestjs/websockets': '*'
    peerDependenciesMeta:
      '@nestjs/platform-express':
        optional: true
      '@nestjs/websockets':
        optional: true

# pnpm >= 11 remplace "onlyBuiltDependencies" par "allowBuilds" (map name -> bool).
# true = scripts de build autorisés (natifs nécessaires), comme dans l'ancien
# onlyBuiltDependencies. cpu-features/puppeteer/ssh2 restaient non buildés -> false.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  cpu-features: false
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  puppeteer: false
  sharp: true
  ssh2: false
  unrs-resolver: true
